name: Pit monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30  min (~1440 billed min/month; GitHub may delay runs a bit)
  workflow_dispatch:          # "Run workflow" button
    inputs:
      test:
        description: "Send a test message to Discord"
        type: boolean
        default: true

permissions:
  contents: write   # to save state.json

concurrency:
  group: pit-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check island
        run: python3 monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          ISLAND_CODE: ${{ vars.ISLAND_CODE }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state"
            git push
          fi
