name: Pit monitor

# Started by cron-job.org through the GitHub API:
#   every 5 min  -> {"ref":"main","inputs":{"mode":"check"}}
#   every hour   -> {"ref":"main","inputs":{"mode":"report"}}
# "Run workflow" button in the Actions tab -> test message by default.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check / report / test"
        type: choice
        options: [test, check, report]
        default: test

permissions:
  contents: write   # to save state.json

concurrency:
  group: pit-monitor-${{ inputs.mode }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run monitor
        run: python3 monitor.py
        env:
          MODE: ${{ inputs.mode }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          ISLAND_CODE: ${{ vars.ISLAND_CODE }}

      - name: Save state
        if: inputs.mode == 'check'
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor state"
            git pull --rebase
            git push
          fi
